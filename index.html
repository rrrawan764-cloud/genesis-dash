<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis Coupe HUD</title>
    <style>
        body {
            background: radial-gradient(circle, #15151c 0%, #07070a 100%);
            color: #f0f0f5;
            font-family: 'Segoe UI', 'Tahoma', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .dashboard {
            width: 95vw;
            max-width: 950px;
            background: #0a0a0f;
            border: 4px solid #1a1a24;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .header { 
            font-size: 24px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            margin-bottom: 15px; 
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .header .english { 
            font-size: 20px; 
            color: #ffcc00; 
            letter-spacing: 4px;
        }
        .header .arabic { 
            font-size: 28px; 
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #ffcc00, #ff0033);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255,0,51,0.3);
            letter-spacing: 2px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        .header span { color: #ff0033; text-shadow: 0 0 10px rgba(255,0,51,0.4); }
        .gauges-container { display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
        .gauge-card {
            position: relative;
            width: 240px;
            height: 240px;
            background: #0a0a0d;
            border-radius: 50%;
            border: 8px solid #1e1e28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .needle-center { position: absolute; width: 14px; height: 14px; background: #ff0033; border-radius: 50%; z-index: 2; box-shadow: 0 0 5px #ff0033;}
        .needle {
            position: absolute;
            width: 5px;
            height: 95px;
            background: linear-gradient(to top, #ffcc00, #ff0033);
            bottom: 50%;
            transform-origin: bottom center;
            transform: rotate(-120deg);
            transition: transform 0.05s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 3px;
            z-index: 1;
        }
        .gauge-value { font-size: 42px; font-weight: bold; color: #ffffff; margin-top: 35px; font-family: 'Monaco', monospace; text-shadow: 0 0 5px #ff0033; }
        .gauge-label { font-size: 14px; color: #ffcc00; font-weight: bold; letter-spacing: 2px; background: #00000055; padding: 2px 8px; border-radius: 20px; margin-top: 5px;}
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 35px; border-top: 2px solid #ff0033; padding-top: 20px; }
        .stat-box { background: #111116; padding: 10px; border-radius: 6px; border-left: 3px solid #ffcc00; transition: all 0.2s; }
        .stat-label { font-size: 11px; color: #ffcc00; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #ffffff; font-family: monospace; }
        .badge {
            margin-top: 15px;
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
            border-top: 1px solid #222;
            padding-top: 12px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .badge span { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="english">GENESIS <span>MOTORS</span></div>
            <div class="arabic">جينسيس كوبيه</div>
        </div>
        <div class="gauges-container">
            <div class="gauge-card">
                <div id="rpmNeedle" class="needle"></div>
                <div class="needle-center"></div>
                <div id="rpmNum" class="gauge-value">0</div>
                <div class="gauge-label">RPM x1000</div>
            </div>
            <div class="gauge-card">
                <div id="speedNeedle" class="needle"></div>
                <div class="needle-center"></div>
                <div id="speedNum" class="gauge-value">0</div>
                <div class="gauge-label">KM/H</div>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">🌡 Water Temp</div><div class="stat-value" id="waterTemp">90°C</div></div>
            <div class="stat-box"><div class="stat-label">⚡ Volts</div><div class="stat-value" id="voltage">14.2V</div></div>
            <div class="stat-box"><div class="stat-label">🎯 Throttle</div><div class="stat-value" id="throttle">35%</div></div>
            <div class="stat-box"><div class="stat-label">⛽ Fuel</div><div class="stat-value" id="fuel">75%</div></div>
        </div>
        <div class="badge">
            <span>✦ 3.8 LAMBDA ✦</span>
            <span>✦ 6-SPEED ✦</span>
            <span>✦ RWD ✦</span>
        </div>
    </div>
    <script>
        let rpm = 1000; let speed = 0; let throttle = 35; let fuel = 75; let waterTemp = 90; let voltage = 14.2;
        let accelerating = true;
        const MAX_RPM = 7800; const REDLINE = 6800; const MAX_SPEED = 280;
        function updateHUD() {
            if (accelerating) {
                rpm += 22 + (throttle / 15);
                speed += 0.9 + (throttle / 80);
                throttle = Math.min(100, throttle + 0.5);
                if (rpm >= MAX_RPM) accelerating = false;
            } else {
                rpm -= 30;
                speed = Math.max(0, speed - 1.5);
                throttle = Math.max(8, throttle - 0.7);
                if (rpm <= 1300 || speed < 5) accelerating = true;
            }
            rpm = Math.min(MAX_RPM, Math.max(800, rpm));
            speed = Math.min(MAX_SPEED, Math.max(0, speed));
            if (rpm > 5500) waterTemp = Math.min(125, waterTemp + 0.1);
            else if (waterTemp > 88) waterTemp = Math.max(88, waterTemp - 0.05);
            voltage = 13.6 + (rpm / 7800) * 1.4;
            voltage = Math.min(14.8, Math.max(13.2, voltage));
            fuel = Math.max(0, fuel - ((throttle / 100) * 0.018));
            if (fuel < 1 && !accelerating && speed < 10) { fuel = 78; waterTemp = 92; }
            document.getElementById('rpmNum').innerHTML = (rpm / 1000).toFixed(1);
            document.getElementById('speedNum').innerHTML = Math.floor(speed);
            document.getElementById('throttle').innerHTML = Math.floor(throttle) + '%';
            document.getElementById('fuel').innerHTML = Math.floor(fuel) + '%';
            document.getElementById('waterTemp').innerHTML = Math.floor(waterTemp) + '°C';
            document.getElementById('voltage').innerHTML = voltage.toFixed(1) + 'V';
            let rpmAngle = (rpm / MAX_RPM) * 240 - 120;
            let speedAngle = (speed / MAX_SPEED) * 240 - 120;
            document.getElementById('rpmNeedle').style.transform = `rotate(${rpmAngle}deg)`;
            document.getElementById('speedNeedle').style.transform = `rotate(${speedAngle}deg)`;
            if (rpm > REDLINE) {
                document.getElementById('rpmNum').style.color = '#ff3366';
                document.getElementById('rpmNum').style.textShadow = '0 0 12px #ff0033';
                document.querySelector('.gauge-card:first-child').style.borderColor = '#ff0033';
            } else {
                document.getElementById('rpmNum').style.color = '#ffffff';
                document.getElementById('rpmNum').style.textShadow = '0 0 5px #ff0033';
                document.querySelector('.gauge-card:first-child').style.borderColor = '#1e1e28';
            }
            requestAnimationFrame(updateHUD);
        }
        updateHUD();
    </script>
</body>
</html>
