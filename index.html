<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis Coupe | REAL Digital Cockpit</title>
    <style>
        body {
            background: radial-gradient(circle at 20% 30%, #0a0a12 0%, #010101 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Tahoma', monospace;
            margin: 0;
            overflow: hidden;
        }
        .dashboard {
            width: 95vw;
            max-width: 1400px;
            background: rgba(5, 5, 12, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            border: 1px solid rgba(255, 51, 102, 0.5);
            padding: 25px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header .english { font-size: 22px; font-weight: 800; letter-spacing: 8px; color: #ff3366; }
        .header .arabic { font-size: 28px; font-weight: bold; color: #ffffff; text-shadow: 0 0 8px #ff3366; }
        .gauges-container { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 20px; }
        .gauge {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 3px solid rgba(255, 51, 102, 0.7);
            box-shadow: 0 0 25px rgba(255,51,102,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .needle {
            position: absolute;
            width: 6px;
            height: 105px;
            background: linear-gradient(180deg, #ffcc44, #ff3366);
            bottom: 50%;
            transform-origin: bottom center;
            transform: rotate(-130deg);
            border-radius: 10px;
            transition: transform 0.05s ease-out;
            z-index: 2;
        }
        .gauge-value { font-size: 48px; font-weight: 900; color: #ffffff; text-shadow: 0 0 6px #ff3366; margin-top: 45px; }
        .gauge-label { font-size: 13px; color: #88aaff; font-weight: bold; letter-spacing: 2px; }
        .car-image-container {
            width: 380px;
            height: 220px;
            border-radius: 35px;
            border: 2px solid rgba(255,51,102,0.6);
            overflow: hidden;
        }
        .car-image { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 30px 0; }
        .card { background: rgba(16, 20, 30, 0.8); border-radius: 20px; padding: 15px; text-align: center; border-bottom: 3px solid #ff3366; }
        .panel-label { font-size: 12px; color: #aaccff; text-transform: uppercase; }
        .panel-value { font-size: 32px; font-weight: 800; color: #ffffff; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="english">THE GENESIS EXPERIENCE</div>
            <div class="arabic">GENESIS <span style="color: #ffcc00;">RAWan</span> <small>// COUPE 3.8</small></div>
        </div>
        <div class="gauges-container">
            <div class="gauge"><div id="rpmNeedle" class="needle"></div><div id="rpmNum" class="gauge-value">0</div><div class="gauge-label">RPM x1000</div></div>
            <div class="car-image-container"><img class="car-image" src="image.png"></div>
            <div class="gauge"><div id="speedNeedle" class="needle"></div><div id="speedNum" class="gauge-value">0</div><div class="gauge-label">KM/H</div></div>
        </div>
        <div class="panel">
            <div class="card"><div class="panel-label">GEAR</div><div class="panel-value">3</div></div>
            <div class="card"><div class="panel-label">G-FORCE</div><div class="panel-value">1.12</div></div>
            <div class="card"><div class="panel-label">BOOST (psi)</div><div class="panel-value">22.4</div></div>
            <div class="card"><div class="panel-label">FUEL CONS.</div><div class="panel-value">14.8 L/h</div></div>
        </div>
    </div>
    <script>
        let rpm = 0; let speed = 0; let up = true; const MAX_RPM = 7800;
        setInterval(() => {
            if (up) { rpm += 80; speed += 1.5; if (rpm >= 7000) up = false; }
            else { rpm -= 120; speed -= 2.2; if (rpm <= 1000) up = true; }
            document.getElementById('rpmNum').innerHTML = (rpm / 1000).toFixed(1);
            document.getElementById('speedNum').innerHTML = Math.floor(speed);
            document.getElementById('rpmNeedle').style.transform = `rotate(${(rpm / MAX_RPM) * 240 - 130}deg)`;
            document.getElementById('speedNeedle').style.transform = `rotate(${(speed / 300) * 240 - 130}deg)`;
        }, 30);
    </script>
</body>
</html>
