<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis Coupe HUD | Real Data</title>
    <style>
        body {
            background: radial-gradient(circle, #15151c 0%, #07070a 100%);
            color: #f0f0f5;
            font-family: 'Segoe UI', 'Tahoma', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .dashboard {
            width: 95vw;
            max-width: 950px;
            background: #0a0a0f;
            border: 4px solid #1a1a24;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        
        .header { 
            font-size: 24px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            margin-bottom: 15px; 
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .header .english { 
            font-size: 20px; 
            color: #ffcc00; 
            letter-spacing: 4px;
        }
        .header .arabic { 
            font-size: 28px; 
            font-weight: 800;
            background: linear-gradient(135deg, #ffcc00, #ff0033);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255,0,51,0.3);
            letter-spacing: 2px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        
        .gauges-container { display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
        
        .gauge-card {
            position: relative;
            width: 240px;
            height: 240px;
            background: #0a0a0d;
            border-radius: 50%;
            border: 8px solid #1e1e28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: border-color 0.1s;
        }
        .needle-center { position: absolute; width: 14px; height: 14px; background: #ff0033; border-radius: 50%; z-index: 2; box-shadow: 0 0 5px #ff0033;}
        .needle {
            position: absolute;
            width: 5px;
            height: 95px;
            background: linear-gradient(to top, #ffcc00, #ff0033);
            bottom: 50%;
            transform-origin: bottom center;
            transform: rotate(-120deg);
            transition: transform 0.05s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-radius: 3px;
            z-index: 1;
        }
        .gauge-value { font-size: 42px; font-weight: bold; color: #ffffff; margin-top: 35px; font-family: 'Monaco', monospace; text-shadow: 0 0 5px #ff0033; }
        .gauge-label { font-size: 14px; color: #ffcc00; font-weight: bold; letter-spacing: 2px; background: #00000055; padding: 2px 8px; border-radius: 20px; margin-top: 5px;}
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 35px; border-top: 2px solid #ff0033; padding-top: 20px; }
        .stat-box { background: #111116; padding: 10px; border-radius: 6px; border-left: 3px solid #ffcc00; transition: all 0.2s; }
        .stat-label { font-size: 11px; color: #ffcc00; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #ffffff; font-family: monospace; }
        
        .badge {
            margin-top: 15px;
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
            border-top: 1px solid #222;
            padding-top: 12px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .badge span { color: #ffcc00; font-weight: bold; }

        .status {
            margin-top: 12px;
            font-size: 11px;
            background: #00000077;
            padding: 5px;
            border-radius: 20px;
            color: #88ff88;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="english">GENESIS <span>MOTORS</span></div>
            <div class="arabic">جينسيس كوبيه</div>
        </div>
        
        <div class="gauges-container">
            <div class="gauge-card" id="rpmCard">
                <div id="rpmNeedle" class="needle"></div>
                <div class="needle-center"></div>
                <div id="rpmNum" class="gauge-value">0</div>
                <div class="gauge-label">RPM x1000</div>
            </div>
            <div class="gauge-card">
                <div id="speedNeedle" class="needle"></div>
                <div class="needle-center"></div>
                <div id="speedNum" class="gauge-value">0</div>
                <div class="gauge-label">KM/H</div>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">🌡️ Water Temp</div><div class="stat-value" id="waterTemp">--°C</div></div>
            <div class="stat-box"><div class="stat-label">⚡ Volts</div><div class="stat-value" id="voltage">--V</div></div>
            <div class="stat-box"><div class="stat-label">🎯 Throttle</div><div class="stat-value" id="throttle">--%</div></div>
            <div class="stat-box"><div class="stat-label">⛽ Fuel</div><div class="stat-value" id="fuel">--%</div></div>
        </div>
        
        <div class="badge">
            <span>✦ REAL OBD2 DATA ✦</span>
            <span>✦ 6-SPEED ✦</span>
            <span>✦ RWD ✦</span>
        </div>
        <div class="status" id="statusText">📡 Waiting for Torque Server...</div>
    </div>

    <script>
        // ============================================================
        // GENESIS COUPE HUD - REAL OBD2 DATA FROM TORQUE SERVER
        // ============================================================
        
        let rpm = 0;
        let speed = 0;
        let throttle = 0;
        let waterTemp = 0;
        let voltage = 13.8;
        
        const MAX_RPM = 7800;
        const REDLINE = 6800;
        const MAX_SPEED = 280;
        
        let serverUrl = "http://192.168.0.100:8080"; // CHANGE THIS TO YOUR TORQUE IP
        
        // Function to fetch data from Torque server
        async function fetchRealData() {
            try {
                // Torque default endpoint for JSON data
                const response = await fetch(serverUrl + "/data.json", {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (!response.ok) throw new Error("Server not reachable");
                
                const data = await response.json();
                
                // Parse Torque data (common PID names)
                rpm = parseFloat(data.rpm) || parseFloat(data.RPM) || rpm;
                speed = parseFloat(data.speed) || parseFloat(data.kph) || parseFloat(data.SPEED) || speed;
                throttle = parseFloat(data.throttle) || parseFloat(data.TP) || throttle;
                waterTemp = parseFloat(data.water_temp) || parseFloat(data.ECT) || waterTemp;
                
                // Update voltage if available
                if (data.voltage) voltage = parseFloat(data.voltage);
                
                document.getElementById('statusText').innerHTML = "✅ متصل بالسيارة | بيانات حقيقية";
                document.getElementById('statusText').style.color = "#88ff88";
                
                updateDisplay();
                
            } catch (error) {
                console.log("Connection error:", error);
                document.getElementById('statusText').innerHTML = "⚠️ غير متصل | تأكد من تشغيل Torque Server";
                document.getElementById('statusText').style.color = "#ffaa88";
                
                // Fallback to demo mode when no connection
                generateDemoData();
                updateDisplay();
            }
        }
        
        // Demo data for when car is not connected (testing mode)
        function generateDemoData() {
            let t = Date.now() / 1000;
            rpm = 900 + Math.sin(t * 3) * 300 + Math.sin(t * 0.8) * 200;
            rpm = Math.min(MAX_RPM, Math.max(800, rpm));
            
            speed = Math.max(0, Math.sin(t * 1.2) * 60 + 40);
            throttle = 20 + Math.sin(t * 2.5) * 15;
            waterTemp = 85 + Math.sin(t * 0.2) * 3;
        }
        
        // Update all UI elements
        function updateDisplay() {
            // Update numbers
            document.getElementById('rpmNum').innerHTML = (rpm / 1000).toFixed(1);
            document.getElementById('speedNum').innerHTML = Math.floor(speed);
            document.getElementById('throttle').innerHTML = Math.floor(throttle) + '%';
            document.getElementById('waterTemp').innerHTML = Math.floor(waterTemp) + '°C';
            document.getElementById('voltage').innerHTML = voltage.toFixed(1) + 'V';
            
            // Needle angles
            let rpmAngle = (rpm / MAX_RPM) * 240 - 120;
            let speedAngle = (speed / MAX_SPEED) * 240 - 120;
            
            document.getElementById('rpmNeedle').style.transform = `rotate(${rpmAngle}deg)`;
            document.getElementById('speedNeedle').style.transform = `rotate(${speedAngle}deg)`;
            
            // Redline effect
            if (rpm > REDLINE) {
                document.getElementById('rpmNum').style.color = '#ff3366';
                document.getElementById('rpmNum').style.textShadow = '0 0 12px #ff0033';
                document.getElementById('rpmCard').style.borderColor = '#ff0033';
            } else {
                document.getElementById('rpmNum').style.color = '#ffffff';
                document.getElementById('rpmNum').style.textShadow = '0 0 5px #ff0033';
                document.getElementById('rpmCard').style.borderColor = '#1e1e28';
            }
        }
        
        // Function to set server IP (you can call this from console)
        window.setTorqueServerIP = function(ip) {
            serverUrl = "http://" + ip + ":8080";
            document.getElementById('statusText').innerHTML = "🔁 جاري الاتصال بـ " + serverUrl;
            setTimeout(fetchRealData, 500);
        };
        
        // Auto-detect Torque server (try common IPs)
        function autoDetectServer() {
            const commonIPs = [
                "192.168.0.100",
                "192.168.1.100", 
                "192.168.43.1",
                "10.0.0.2"
            ];
            
            let attempt = 0;
            function tryNext() {
                if (attempt < commonIPs.length) {
                    serverUrl = "http://" + commonIPs[attempt] + ":8080";
                    document.getElementById('statusText').innerHTML = "🔍 جرب " + commonIPs[attempt];
                    attempt++;
                    setTimeout(() => {
                        fetchRealData().catch(() => tryNext());
                    }, 800);
                } else {
                    document.getElementById('statusText').innerHTML = "⚙️ أدخل IP يدوي: setTorqueServerIP('192.168.x.x')";
                }
            }
            tryNext();
        }
        
        // Start fetching data every 200ms
        setInterval(() => {
            fetchRealData();
        }, 200);
        
        // Start auto-detection after 2 seconds
        setTimeout(autoDetectServer, 2000);
    </script>
</body>
</html>
